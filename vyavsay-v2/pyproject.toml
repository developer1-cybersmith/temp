[project]
name = "vyavsay"
version = "0.1.0"
description = "Vyavsay Assist v2: WhatsApp AI sales copilot for small businesses"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "db: needs a local Postgres (VYAVSAY_TEST_DATABASE_URL or default local socket)",
  "conformance: provider adapter conformance suite",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Core never imports provider adapters"
type = "forbidden"
source_modules = ["app.core", "app.ports", "app.agent", "app.api"]
forbidden_modules = ["app.adapters"]

[[tool.importlinter.contracts]]
name = "Agent never touches backend internals (it only proposes)"
type = "forbidden"
source_modules = ["app.agent"]
forbidden_modules = ["app.adapters", "app.api", "app.jobs"]
